<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-NPVBCDZ');</script>
    <!-- End Google Tag Manager -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SITCON Credits</title>
    <link rel="stylesheet" href="./assets/styles.css">
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NPVBCDZ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header class="site-header">
      <div class="header-copy">
        <p class="eyebrow">SITCON Credits</p>
        <h1 id="pageTitle">貢獻紀錄索引</h1>
        <p id="pageLede" class="lede">探索歷屆工作人員、講者與公開貢獻紀錄。</p>
      </div>
      <div class="header-side">
        <a id="claimEntryLink" class="claim-entry-link" href="./?claim=1">有重複的你？或是要更新資料？這邊請</a>
        <p class="prototype-notice">
          Prototype 已凍結；前端期待與使用情境請集中到
          <a href="https://github.com/sitcon-tw/credits/issues/2">需求盤點</a>
        </p>
        <div class="stats" aria-label="資料統計">
          <div>
            <strong data-stat="people">-</strong>
            <span>People</span>
          </div>
          <div>
            <strong data-stat="appearances">-</strong>
            <span>貢獻紀錄</span>
          </div>
          <div>
            <strong data-stat="events">-</strong>
            <span>活動</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="篩選">
        <label class="search-box">
          <span>搜尋</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="姓名、GitHub、活動、組別">
        </label>

        <button class="more-filters-btn" id="moreFiltersBtn" type="button" aria-expanded="false" aria-controls="toolbarFilters">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="8" x2="12" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="6" y1="12" x2="10" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          篩選
        </button>

        <div class="view-icon-switch" role="group" aria-label="檢視模式">
          <button class="is-active" type="button" data-view="grid" aria-label="格狀檢視">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
          <button type="button" data-view="list" aria-label="列表檢視">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><line x1="1" y1="4" x2="15" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="1" y1="8" x2="15" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="1" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="toolbar-filters" id="toolbarFilters">
          <label>
            <span>年份</span>
            <select id="yearFilter">
              <option value="">全部年份</option>
            </select>
          </label>
          <label>
            <span>活動</span>
            <select id="seriesFilter">
              <option value="">全部活動</option>
            </select>
          </label>
          <label>
            <span>組別</span>
            <select id="roleFilter">
              <option value="">全部組別</option>
            </select>
          </label>
          <div class="segmented-control view-switch" role="group" aria-label="檢視模式">
            <button class="is-active" type="button" data-view="grid">頭像牆</button>
            <button type="button" data-view="list">列表</button>
          </div>
          <div class="segmented-control sort-switch" role="group" aria-label="排序">
            <button class="is-active" type="button" data-sort="daily">每日輪替</button>
            <button type="button" data-sort="canonical">資料順序</button>
            <button type="button" data-sort="shuffle">重新亂序</button>
          </div>
        </div>
      </section>

      <section class="result-meta" aria-live="polite">
        <p><strong id="resultCount">0</strong> 個顯示項目</p>
        <p id="sourceMeta">載入資料中</p>
      </section>

      <section id="claimPanel" class="claim-panel" aria-label="標記我的貢獻紀錄" hidden>
        <div>
          <h2>先標記，再送出表單</h2>
          <p>搜尋或篩選你曾參與的活動，找到自己的紀錄按下「標記」，完成後開啟表單填寫公開資料；手動發 PR 者請複製分享網址</p>
        </div>
        <div class="claim-actions">
          <button id="claimClearButton" type="button" disabled>清除</button>
          <button id="claimCopyLinkButton" type="button" disabled>複製分享網址</button>
          <button id="claimIssueButton" class="claim-next-action" type="button" disabled>開啟表單</button>
        </div>
        <p class="claim-status"><strong id="claimCount">0</strong> 個已標記項目</p>
        <div id="claimSelection" class="claim-selection" aria-label="已標記項目"></div>
        <p id="claimNotice" class="claim-notice" aria-live="polite"></p>
      </section>

      <section id="peopleGrid" class="people-grid" aria-label="貢獻者頭像牆"></section>
      <section id="peopleList" class="people-list" aria-label="貢獻者列表" hidden></section>
    </main>

    <dialog id="personDialog">
      <article class="person-panel">
        <button class="close-button" type="button" value="cancel" aria-label="關閉">×</button>
        <div id="personDetail"></div>
      </article>
    </dialog>

    <template id="avatarTemplate">
      <article class="person-card" role="button" tabindex="0">
        <span class="avatar" aria-hidden="true"></span>
        <span class="person-name"></span>
        <span class="person-note"></span>
      </article>
    </template>

    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
