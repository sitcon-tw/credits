name: Write Google service account credentials
description: Write service account JSON to a runner temp file and export GOOGLE_APPLICATION_CREDENTIALS.

inputs:
  service-account-json:
    description: Google service account JSON content, usually from the GOOGLE_SERVICE_ACCOUNT_JSON repository secret.
    required: true

runs:
  using: composite
  steps:
    - name: Write credentials file
      shell: bash
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ inputs.service-account-json }}
      run: |
        if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
          echo "GOOGLE_SERVICE_ACCOUNT_JSON repository secret is required." >&2
          exit 1
        fi
        credentials_path="$RUNNER_TEMP/google-service-account.json"
        printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$credentials_path"
        chmod 600 "$credentials_path"
        echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_path" >> "$GITHUB_ENV"
