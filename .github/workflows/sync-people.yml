name: Sync people helper

on:
  repository_dispatch:
    types:
      - sync-people-from-profiles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync profiles to people sheet
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out profiles repository
        uses: actions/checkout@v6
        with:
          repository: sitcon-tw/credits-profiles
          path: tmp/credits-profiles

      - name: Set up repository tools
        uses: ./.github/actions/setup-tools

      - name: Write Google service account credentials
        uses: ./.github/actions/google-credentials
        with:
          service-account-json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Sync people helper sheet
        run: pnpm sheets:sync-people
