name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository tools
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up repository tools
        uses: ./.github/actions/setup-tools

      - name: Run tests
        run: pnpm test

      - name: Check Sheets initialization plan
        run: pnpm sheets:init:dry-run

      - name: Check Sheets export plan
        run: pnpm sheets:export:dry-run
