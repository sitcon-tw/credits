name: Apply profile claims

on:
  repository_dispatch:
    types:
      - apply-profile-claims
  workflow_dispatch:
    inputs:
      pull_number:
        description: credits-profiles PR number
        required: false
        type: number
      head_sha:
        description: Expected PR head SHA
        required: false
        type: string
      issue_number:
        description: credits-profiles profile request issue number for claim-only mode
        required: false
        type: number
      username:
        description: GitHub username for claim-only issue mode
        required: false
        type: string
      check_run_id:
        description: Optional claim confirmation check run id
        required: false
        type: string
      confirmation_comment_id:
        description: Claim confirmation issue comment id
        required: false
        type: string
      recovery_only:
        description: Only sweep checked profile claim confirmations for missed applies
        required: false
        type: boolean
        default: false
      recovery_since_hours:
        description: Lookback window for checked claim confirmation recovery
        required: false
        type: number
        default: 24
      recovery_limit:
        description: Maximum checked claim confirmation comments to inspect
        required: false
        type: number
        default: 100

permissions:
  contents: write

concurrency:
  group: canonical-data-write
  cancel-in-progress: false

jobs:
  apply:
    name: Apply confirmed profile claims
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out credits repository
        uses: actions/checkout@v6

      - name: Check out profiles repository
        uses: actions/checkout@v6
        with:
          repository: sitcon-tw/credits-profiles
          path: tmp/credits-profiles

      - name: Set up repository tools
        uses: ./.github/actions/setup-tools

      - name: Resolve request payload
        id: payload
        uses: actions/github-script@v9
        with:
          script: |
            const payload = context.payload.client_payload || {};
            const inputs = context.payload.inputs || {};
            const recoveryOnly = payload.recovery_only ?? inputs.recovery_only ?? false;
            if (String(recoveryOnly) === 'true') {
              core.setOutput('mode', 'recovery');
              core.setOutput('recovery_since_hours', String(payload.recovery_since_hours || inputs.recovery_since_hours || 24));
              core.setOutput('recovery_limit', String(payload.recovery_limit || inputs.recovery_limit || 100));
              return;
            }
            const issueNumber = payload.issue_number || inputs.issue_number || '';
            const username = payload.username || inputs.username || '';
            const pullNumber = payload.pull_number || inputs.pull_number;
            const headSha = payload.head_sha || inputs.head_sha;
            const confirmationCommentId = payload.confirmation_comment_id || inputs.confirmation_comment_id;
            const checkRunId = payload.check_run_id || inputs.check_run_id || '';
            if (!confirmationCommentId) {
              core.setFailed('confirmation_comment_id is required.');
              return;
            }
            if (issueNumber) {
              if (!username) {
                core.setFailed('username is required for issue-mode claims.');
                return;
              }
              core.setOutput('mode', 'issue');
              core.setOutput('issue_number', String(issueNumber));
              core.setOutput('username', String(username));
              core.setOutput('confirmation_comment_id', String(confirmationCommentId));
              core.setOutput('check_run_id', '');
              return;
            }
            if (!pullNumber || !headSha) {
              core.setFailed('pull_number and head_sha are required for pull-request-mode claims.');
              return;
            }
            core.setOutput('mode', 'pull_request');
            core.setOutput('pull_number', String(pullNumber));
            core.setOutput('head_sha', String(headSha));
            core.setOutput('confirmation_comment_id', String(confirmationCommentId));
            core.setOutput('check_run_id', String(checkRunId));

      - name: Write Google service account credentials
        uses: ./.github/actions/google-credentials
        with:
          service-account-json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Export canonical Sheet data before apply
        run: pnpm sheets:export --output-dir "$RUNNER_TEMP/sheets-export-before"

      - name: Create credits assistant token
        id: credits-assistant-token
        uses: ./.github/actions/credits-assistant-token
        with:
          client-id: ${{ vars.SITCON_CREDITS_ASSISTANT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITCON_CREDITS_ASSISTANT_APP_PRIVATE_KEY }}
          repositories: credits,credits-profiles
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Apply confirmed profile claims
        if: steps.payload.outputs.mode != 'recovery'
        env:
          GITHUB_TOKEN: ${{ steps.credits-assistant-token.outputs.token }}
          CHECK_RUN_ID: ${{ steps.payload.outputs.check_run_id }}
        run: |
          args=(
            --owner "sitcon-tw"
            --repo "credits-profiles"
            --export "$RUNNER_TEMP/sheets-export-before/export.json"
            --confirmation-comment-id "${{ steps.payload.outputs.confirmation_comment_id }}"
          )
          if [ "${{ steps.payload.outputs.mode }}" = "issue" ]; then
            args+=(
              --issue-number "${{ steps.payload.outputs.issue_number }}"
              --username "${{ steps.payload.outputs.username }}"
            )
          else
            args+=(
              --pull-number "${{ steps.payload.outputs.pull_number }}"
              --head-sha "${{ steps.payload.outputs.head_sha }}"
            )
          fi
          if [ -n "$CHECK_RUN_ID" ]; then
            args+=(--check-run-id "$CHECK_RUN_ID")
          fi
          node scripts/profiles/apply-claims.mjs "${args[@]}" --plan-output "$RUNNER_TEMP/profile-claim-plan.json" --apply

      - name: Export canonical Sheet data after apply
        if: steps.payload.outputs.mode != 'recovery'
        run: pnpm sheets:export --output-dir "$RUNNER_TEMP/sheets-export-after"

      - name: Recover missed profile claim applies
        env:
          GITHUB_TOKEN: ${{ steps.credits-assistant-token.outputs.token }}
        run: |
          args=(
            --owner "sitcon-tw"
            --repo "credits-profiles"
            --target-owner "sitcon-tw"
            --target-repo "credits"
            --assistant-login "${{ steps.credits-assistant-token.outputs.app-slug }}"
            --since-hours "${{ steps.payload.outputs.recovery_since_hours || 24 }}"
            --limit "${{ steps.payload.outputs.recovery_limit || 100 }}"
            --apply
          )
          if [ "${{ steps.payload.outputs.mode }}" = "recovery" ]; then
            args+=(--export "$RUNNER_TEMP/sheets-export-before/export.json")
          else
            args+=(--export "$RUNNER_TEMP/sheets-export-after/export.json")
          fi
          if [ -n "${{ steps.payload.outputs.confirmation_comment_id }}" ]; then
            args+=(--exclude-comment-id "${{ steps.payload.outputs.confirmation_comment_id }}")
          fi
          node scripts/profiles/recover-claim-applies.mjs "${args[@]}"

      - name: Export canonical Sheet data after recovery
        run: pnpm sheets:export --output-dir "$RUNNER_TEMP/sheets-export-final"

      - name: Validate canonical data
        run: >-
          pnpm data:validate
          --export "$RUNNER_TEMP/sheets-export-final/export.json"
          --site-profiles-dir tmp/credits-profiles/site-profiles

      - name: Mark profile claim check successful
        if: steps.payload.outputs.mode == 'pull_request' && steps.payload.outputs.check_run_id != ''
        env:
          GITHUB_TOKEN: ${{ steps.credits-assistant-token.outputs.token }}
        run: >-
          node scripts/profiles/update-claim-check.mjs
          --owner "sitcon-tw"
          --repo "credits-profiles"
          --check-run-id "${{ steps.payload.outputs.check_run_id }}"
          --plan "$RUNNER_TEMP/profile-claim-plan.json"
          --conclusion success

      - name: Dispatch profile PR review
        if: steps.payload.outputs.mode == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'review-profile-pr',
              client_payload: {
                source_repository: 'sitcon-tw/credits-profiles',
                pull_number: Number('${{ steps.payload.outputs.pull_number }}'),
                head_sha: '${{ steps.payload.outputs.head_sha }}',
              },
            });

      - name: Dispatch Pages rebuild for profile issue
        if: steps.payload.outputs.mode == 'issue'
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'rebuild-pages-from-profiles',
              client_payload: {
                source_repository: 'sitcon-tw/credits-profiles',
                profile_issue_number: Number('${{ steps.payload.outputs.issue_number }}'),
                profile_username: '${{ steps.payload.outputs.username }}',
              },
            });

      - name: Mark profile claim check failed
        if: failure() && steps.payload.outputs.mode == 'pull_request' && steps.payload.outputs.check_run_id != ''
        env:
          GITHUB_TOKEN: ${{ steps.credits-assistant-token.outputs.token }}
        run: >-
          node scripts/profiles/update-claim-check.mjs
          --owner "sitcon-tw"
          --repo "credits-profiles"
          --check-run-id "${{ steps.payload.outputs.check_run_id }}"
          --conclusion failure
          --message "Apply profile claims workflow failed; check the workflow logs."
