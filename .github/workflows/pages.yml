name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  repository_dispatch:
    types:
      - rebuild-pages-from-profiles
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out profiles repository
        uses: actions/checkout@v6
        with:
          repository: sitcon-tw/credits-profiles
          path: tmp/credits-profiles

      - name: Set up repository tools
        uses: ./.github/actions/setup-tools

      - name: Write Google service account credentials
        uses: ./.github/actions/google-credentials
        with:
          service-account-json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Export canonical Sheet data
        run: pnpm sheets:export

      - name: Validate exported data
        run: pnpm data:validate --site-profiles-dir=tmp/credits-profiles/site-profiles

      - name: Build static site
        run: >-
          pnpm site:build --
          --profiles-dir tmp/credits-profiles/profiles
          --site-profiles-dir tmp/credits-profiles/site-profiles

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  comment:
    name: Comment on published profile request
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.profile_username && (github.event.client_payload.profile_pull_number || github.event.client_payload.profile_issue_number)
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up repository tools
        uses: ./.github/actions/setup-tools

      - name: Create credits assistant token
        id: credits-assistant-token
        uses: ./.github/actions/credits-assistant-token
        with:
          client-id: ${{ vars.SITCON_CREDITS_ASSISTANT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITCON_CREDITS_ASSISTANT_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Comment on published profile request
        env:
          GITHUB_TOKEN: ${{ steps.credits-assistant-token.outputs.token }}
        run: |
          args=(
            --owner "sitcon-tw"
            --repo "credits-profiles"
            --username "${{ github.event.client_payload.profile_username }}"
            --assistant-login "${{ steps.credits-assistant-token.outputs.app-slug }}"
          )
          if [ -n "${{ github.event.client_payload.profile_pull_number }}" ]; then
            args+=(--pull-number "${{ github.event.client_payload.profile_pull_number }}")
          fi
          if [ -n "${{ github.event.client_payload.profile_issue_number }}" ]; then
            args+=(--issue-number "${{ github.event.client_payload.profile_issue_number }}")
          fi
          node scripts/profiles/comment-published-profile.mjs "${args[@]}"
