name: Review profile PR

on:
  repository_dispatch:
    types:
      - review-profile-pr

permissions:
  contents: read

jobs:
  review:
    name: Review profile PR against canonical appearances
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out credits repository
        uses: actions/checkout@v6

      - name: Check out profiles repository
        uses: actions/checkout@v6
        with:
          repository: sitcon-tw/credits-profiles
          path: tmp/credits-profiles

      - name: Set up repository tools
        uses: ./.github/actions/setup-tools

      - name: Write Google service account credentials
        uses: ./.github/actions/google-credentials
        with:
          service-account-json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Export canonical Sheet data
        run: pnpm sheets:export --output-dir "$RUNNER_TEMP/sheets-export"

      - name: Create credits assistant token
        id: credits-assistant-token
        uses: ./.github/actions/credits-assistant-token
        with:
          client-id: ${{ vars.SITCON_CREDITS_ASSISTANT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITCON_CREDITS_ASSISTANT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create profile claim confirmation comment
        env:
          GITHUB_TOKEN: ${{ steps.credits-assistant-token.outputs.token }}
        run: >-
          node scripts/profiles/create-claim-comment.mjs
          --owner "sitcon-tw"
          --repo "credits-profiles"
          --pull-number "${{ github.event.client_payload.pull_number }}"
          --head-sha "${{ github.event.client_payload.head_sha }}"
          --export "$RUNNER_TEMP/sheets-export/export.json"
          --assistant-login "${{ steps.credits-assistant-token.outputs.app-slug }}"
          --plan-output "$RUNNER_TEMP/profile-claim-plan.json"

      - name: Approve or comment on profile PR
        working-directory: tmp/credits-profiles
        env:
          GITHUB_TOKEN: ${{ steps.credits-assistant-token.outputs.token }}
          PROFILE_REVIEW_TOKEN: ${{ steps.credits-assistant-token.outputs.token }}
          CREDITS_ASSISTANT_BOT_LOGIN: ${{ steps.credits-assistant-token.outputs.app-slug }}
        run: >-
          node scripts/profiles/auto-review.mjs
          --owner "sitcon-tw"
          --repo "credits-profiles"
          --pull-number "${{ github.event.client_payload.pull_number }}"
          --head-sha "${{ github.event.client_payload.head_sha }}"
          --export "$RUNNER_TEMP/sheets-export/export.json"
          --claim-plan "$RUNNER_TEMP/profile-claim-plan.json"
          --auto-merge
          --merge-method "squash"
