name: Export Sheets data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export and validate canonical data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up repository tools
        uses: ./.github/actions/setup-tools

      - name: Write Google service account credentials
        uses: ./.github/actions/google-credentials
        with:
          service-account-json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Export canonical Sheet data
        run: pnpm sheets:export

      - name: Create credits assistant token
        id: credits-assistant-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SITCON_CREDITS_ASSISTANT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITCON_CREDITS_ASSISTANT_APP_PRIVATE_KEY }}
          owner: sitcon-tw
          repositories: credits-profiles
          permission-contents: write

      - name: Check out profiles repository
        uses: actions/checkout@v6
        with:
          repository: sitcon-tw/credits-profiles
          path: tmp/credits-profiles
          token: ${{ steps.credits-assistant-token.outputs.token }}

      - name: Validate exported data
        run: pnpm data:validate --site-profiles-dir=tmp/credits-profiles/site-profiles

      - name: Upload export artifact
        uses: actions/upload-artifact@v7
        with:
          name: sheets-export
          path: tmp/sheets-export/
          if-no-files-found: error

      - name: Create missing blank profile templates
        run: pnpm profiles:create-missing

      - name: Validate generated profiles
        working-directory: tmp/credits-profiles
        run: |
          pnpm install --frozen-lockfile
          pnpm profiles:validate

      - name: Commit profile templates to profiles repository
        env:
          GH_TOKEN: ${{ steps.credits-assistant-token.outputs.token }}
          CREDITS_ASSISTANT_APP_SLUG: ${{ steps.credits-assistant-token.outputs.app-slug }}
        run: |
          if [ -z "$(git -C tmp/credits-profiles status --porcelain -- profiles)" ]; then
            echo "No missing profile templates."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "SITCON Credits Assistant GitHub App token is required to push credits-profiles templates." >&2
            exit 1
          fi
          if [ -z "$CREDITS_ASSISTANT_APP_SLUG" ]; then
            echo "GitHub App slug is required to configure the commit author." >&2
            exit 1
          fi

          app_user_id="$(gh api "/users/${CREDITS_ASSISTANT_APP_SLUG}[bot]" --jq .id)"
          cd tmp/credits-profiles
          git config user.name "SITCON Credits Assistant"
          git config user.email "${app_user_id}+${CREDITS_ASSISTANT_APP_SLUG}[bot]@users.noreply.github.com"
          git add profiles
          git commit -m "chore: add blank profile templates"
          git push origin HEAD:master
